version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: examtopics-mongodb
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?Set a local MongoDB username in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Set a local MongoDB password in .env}
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    networks:
      - examtopics-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:

networks:
  examtopics-network:
    driver: bridge
